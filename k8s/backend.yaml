# ===== Deployment : "fais tourner le backend" =====
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: jobfit-backend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            # Adresse du scraper : le nom de son Service
            - name: SCRAPER_URL
              value: "http://scraper:8000"
            # La clé vient du Secret, jamais écrite en clair
            - name: HUGGINGFACE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jobfit-secrets
                  key: HUGGINGFACE_API_KEY
          # Java démarre lentement : on lui laisse jusqu'à 2 min 30
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
---
# ===== Service : "donne une adresse fixe au backend" =====
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080