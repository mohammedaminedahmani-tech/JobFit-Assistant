# ===== Ingress : la porte d'entrée de l'application =====
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jobfit
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          # Les appels /api vont directement au backend
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          # Tout le reste va au frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80