# ===== Panneau de contrôle de JobFit Assistant =====

scraper:
  image:
    repository: ghcr.io/mohammedaminedahmani-tech/jobfit-scraper
    tag: f68d788fd9975e6618e333a61c68b572598740c7
  replicas: 1
  port: 8000
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }

backend:
  image:
    repository: ghcr.io/mohammedaminedahmani-tech/jobfit-backend
    tag: f68d788fd9975e6618e333a61c68b572598740c7
  replicas: 1
  port: 8080
  # Nom du Secret Kubernetes qui contient HUGGINGFACE_API_KEY
  # (créé à part, jamais stocké dans ce fichier)
  existingSecret: jobfit-secrets
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 768Mi }
  # Autoscaling horizontal (HPA)
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70

frontend:
  image:
    repository: ghcr.io/mohammedaminedahmani-tech/jobfit-frontend
    tag: f68d788fd9975e6618e333a61c68b572598740c7
  replicas: 1
  port: 8080
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

ingress:
  enabled: true
  className: traefik

imagePullPolicy: IfNotPresent


monitoring:
  serviceMonitor:
    enabled: true
  dashboard:
    enabled: true
    namespace: monitoring