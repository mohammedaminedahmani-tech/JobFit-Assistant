name: CI

# Quand lancer ce workflow
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # ===== Backend : compilation + tests =====
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Tests Maven
        run: mvn -B verify
        env:
          # Fausse clé : le test vérifie juste que l'application démarre
          HUGGINGFACE_API_KEY: dummy-key-for-ci

  # ===== Frontend : installation + build =====
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend-service/package-lock.json
      - run: npm ci
      - run: npm run build

  # ===== Scraper : installation + vérification =====
  scraper:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scraper-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Le module se charge sans erreur
        run: python -c "import scraper_engine"

  # ===== Helm : validation du chart =====
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint helm/jobfit
      
  # ===== Publication des images (uniquement sur main) =====
  publish:
    # Ne tourne que si les 4 jobs de vérification ont réussi
    needs: [backend, frontend, scraper, helm]
    # Et seulement après une fusion dans main (pas sur les PR)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [scraper, backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build et push de jobfit-${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}-service
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/jobfit-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/jobfit-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}


  
  # ===== Mise à jour du chart avec les nouveaux tags (GitOps) =====
  update-chart:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Écrire le nouveau tag dans values.yaml
        run: |
          sed -i "s|^\(\s*tag:\s*\).*|\1${GITHUB_SHA}|" helm/jobfit/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add helm/jobfit/values.yaml
          git commit -m "chore(deploy): update image tags to ${GITHUB_SHA::7} [skip ci]" || echo "Rien à changer"
          git push     